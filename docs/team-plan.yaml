## 任务清单（17 个核心任务）

### Phase 1 — macOS 核心路径（最高优先级，必须先跑通）

#### T1: 写 macOS 版 live_reply_probe.py
- **owner**: backend-platform-engineer
- **产出**: `backend/live_reply_probe.py`
- **镜像 Windows 版功能**：默认仅检查联系人；`--allow-vision` 启用视觉；`--send` 发送；`--alternate-with` 二联系人交替
- **报告路径**: `data/live_reply_probe_result.json`
- **verify**: 文件存在 + CLI 参数正确 + 默认不发消息 + 接口对等 Windows 版

#### T2: 实机编译并运行 mach_helper
- **owner**: backend-platform-engineer
- **产出**: `data/key_extraction_smoke_<date>.json` + `data/all_keys.json`
- **verify**: 编译通过 + PID 找到 + key 提取 < 10s + DB 校验通过 + 报告不含 key

#### T3: 实机跑通 DB 监听 → AI 回复 → AppleScript 发送
- **owner**: backend-platform-engineer
- **产出**: `data/db_monitor_smoke_<date>.json`
- **verify**: 检测到消息 + AI < 30s + 发送 < 15s + 标题匹配 + 频率未触发

### Phase 2 — AI 层

#### T4: 审查并补全 ai/ 模块测试
- **owner**: backend-platform-engineer
- **产出**: `backend/tests/test_ai_*.py`
- **verify**: pytest 全部通过 + 无 Windows 依赖

#### T5: 工具调用（4 类工具 + 测试）
- **owner**: backend-platform-engineer
- **产出**: `backend/app/ai/tools.py` 真实可用 + 4 个测试文件
- **verify**: 每工具 ≥ 3 测试 + 缺 key 降级

#### T6: Person Skill（本人人设）
- **owner**: backend-platform-engineer
- **产出**: `style_distiller.py` + `persona_api.py`
- **verify**: test_persona_skill 通过 + 空数据不报错 + prompt 不含敏感信息

