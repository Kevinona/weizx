[pytest]
# Skip tests that require the full langchain stack (langchain_openai,
# langchain_community, etc.) when those packages are not installed.
#
# These tests are part of the project but we can't collect them in a
# minimal venv. They're excluded by default and can be re-enabled
# explicitly with: pytest --langchain-heavy
#
# The 4 files below all import app.ai.agent or app.ai.tools which
# transitively require langchain_openai / langchain_community at
# module-load time.
addopts = --ignore=tests/test_agent_recovery.py
          --ignore=tests/test_ai_agent.py
          --ignore=tests/test_ai_tools.py
          --ignore=tests/test_persona_skill.py
asyncio_mode = strict
